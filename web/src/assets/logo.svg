<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 软件指南生成器：玻璃手册页 + 手机截图卡片 + 生成的闪光。macOS 26 分层玻璃图标风格。 -->
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#7BDCFF"/>
      <stop offset="0.42" stop-color="#2E7CFF"/>
      <stop offset="1" stop-color="#5A3BE0"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.28" cy="0.16" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgDeep" cx="0.85" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#2A0E8F" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2A0E8F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#EAF2FF" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#3D6BFF" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#2A1C9E" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="phoneSheen" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#FFF6D6"/>
      <stop offset="1" stop-color="#FFD66B"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#160A6B" flood-opacity="0.38"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0B1460" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <!-- 底板 -->
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#bgDeep)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#bgGlow)"/>
  </g>
  <rect x="102" y="102" width="820" height="820" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="4"/>

  <!-- 手册页（玻璃纸） -->
  <g transform="rotate(-7 430 520)" filter="url(#shadow)">
    <rect x="262" y="250" width="380" height="500" rx="58" fill="url(#paper)"/>
    <rect x="264" y="252" width="376" height="496" rx="56" fill="none" stroke="url(#rim)" stroke-width="5"/>
    <rect x="316" y="320" width="190" height="28" rx="14" fill="#2E7CFF" fill-opacity="0.85"/>
    <rect x="316" y="384" width="270" height="20" rx="10" fill="#5A6B9A" fill-opacity="0.28"/>
    <rect x="316" y="428" width="240" height="20" rx="10" fill="#5A6B9A" fill-opacity="0.28"/>
    <rect x="316" y="472" width="200" height="20" rx="10" fill="#5A6B9A" fill-opacity="0.22"/>
    <rect x="316" y="548" width="150" height="20" rx="10" fill="#5A6B9A" fill-opacity="0.2"/>
    <rect x="316" y="592" width="120" height="20" rx="10" fill="#5A6B9A" fill-opacity="0.18"/>
  </g>

  <!-- 手机截图卡片（深色玻璃） -->
  <g transform="rotate(8 610 560)" filter="url(#softShadow)">
    <rect x="500" y="330" width="250" height="450" rx="62" fill="url(#phone)"/>
    <rect x="500" y="330" width="250" height="450" rx="62" fill="url(#phoneSheen)"/>
    <rect x="502" y="332" width="246" height="446" rx="60" fill="none" stroke="url(#rim)" stroke-width="5"/>
    <rect x="590" y="352" width="70" height="16" rx="8" fill="#0A0F3A" fill-opacity="0.55"/>
    <rect x="530" y="400" width="190" height="96" rx="24" fill="#FFFFFF" fill-opacity="0.9"/>
    <rect x="550" y="424" width="90" height="16" rx="8" fill="#2E7CFF" fill-opacity="0.9"/>
    <rect x="550" y="456" width="130" height="14" rx="7" fill="#2E7CFF" fill-opacity="0.35"/>
    <rect x="530" y="514" width="88" height="88" rx="22" fill="#FFFFFF" fill-opacity="0.55"/>
    <rect x="632" y="514" width="88" height="88" rx="22" fill="#FFFFFF" fill-opacity="0.38"/>
    <rect x="530" y="620" width="190" height="56" rx="20" fill="#FFFFFF" fill-opacity="0.3"/>
    <rect x="530" y="700" width="190" height="44" rx="22" fill="#7BDCFF" fill-opacity="0.85"/>
  </g>

  <!-- 生成的闪光 -->
  <g transform="translate(752 268)">
    <circle r="62" fill="#FFE9A8" fill-opacity="0.55" filter="url(#glow)"/>
    <path d="M0 -78 C 8 -22, 22 -8, 78 0 C 22 8, 8 22, 0 78 C -8 22, -22 8, -78 0 C -22 -8, -8 -22, 0 -78 Z" fill="url(#spark)"/>
    <path d="M0 -78 C 8 -22, 22 -8, 78 0 C 22 8, 8 22, 0 78 C -8 22, -22 8, -78 0 C -22 -8, -8 -22, 0 -78 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="3"/>
  </g>
  <g transform="translate(830 400)">
    <path d="M0 -30 C 3 -9, 9 -3, 30 0 C 9 3, 3 9, 0 30 C -3 9, -9 3, -30 0 C -9 -3, -3 -9, 0 -30 Z" fill="#FFFFFF" fill-opacity="0.9"/>
  </g>
</svg>
